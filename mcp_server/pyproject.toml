[project]
name = "umt-mcp"
version = "0.1.0"
description = "PC-side MCP server for Alltear UMT (Android UE memory dumper)."
requires-python = ">=3.10"
dependencies = [
    "mcp>=1.0,<2",
    "capstone>=5.0,<6",
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]

[project.scripts]
umt-mcp = "server:main"

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
